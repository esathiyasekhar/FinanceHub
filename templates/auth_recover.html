{% extends "auth_base.html" %}
{% block title %}Reset password – Finance Hub{% endblock %}
{% block sub %}Reset a password with the recovery key{% endblock %}
{% block body %}
<form method="post" autocomplete="off">
  <label class="form-label">User ID</label><input name="username" class="form-control mb-3" required>
  <label class="form-label">Recovery key</label><input name="recovery" class="form-control mb-3" required placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" style="font-family:ui-monospace,monospace">
  <label class="form-label">New password</label>
  <input name="password" type="password" class="form-control mb-2" required minlength="10">
  <input name="password2" type="password" class="form-control mb-4" required placeholder="Type it again">
  <button class="btn btn-cta w-100">Reset password</button>
</form>
<div class="mt-3" style="font-size:.78rem"><a href="{{ url_for('login') }}">← Back to log in</a></div>
{% endblock %}
