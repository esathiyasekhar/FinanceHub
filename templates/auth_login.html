{% extends "auth_base.html" %}
{% block title %}Log in – Finance Hub{% endblock %}
{% block body %}
<form method="post" autocomplete="off">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="form-label">User ID</label>
  <input name="username" class="form-control mb-3" autofocus required autocomplete="username">
  <label class="form-label">Password</label>
  <input name="password" type="password" class="form-control mb-4" required autocomplete="current-password">
  <button class="btn btn-cta w-100"><i class="bi bi-unlock me-1"></i>Unlock</button>
</form>
<div class="d-flex justify-content-between mt-3" style="font-size:.78rem">
  <a href="{{ url_for('recover') }}">Forgot password? Use the recovery key</a>
  <span class="muted"><i class="bi bi-lock-fill me-1"></i>AES-256</span>
</div>
{% endblock %}
