<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Finance Hub{% endblock %}</title>
  <script>(function(){var t='auto';try{t=localStorage.getItem('hub_theme')||'auto'}catch(e){}
    var d=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-bs-theme',d?'dark':'light');})();</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    [data-bs-theme="dark"] { --bg:#0b1020; --card:#131a33; --border:#26305a; --text:#e7eaf6; --muted:#8c96b8; --input:#0e1430; }
    [data-bs-theme="light"] { --bg:#f3f5fb; --card:#ffffff; --border:#e2e6f2; --text:#1a2138; --muted:#69728f; --input:#ffffff; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif;
           background:var(--bg); color:var(--text);
           background-image:radial-gradient(900px 500px at 85% -10%, rgba(99,102,241,.18), transparent 60%),
                            radial-gradient(700px 400px at -10% 110%, rgba(20,184,166,.12), transparent 60%); padding:16px; }
    .box { width:min(440px, 100%); background:var(--card); border:1px solid var(--border); border-radius:18px; padding:2rem;
           box-shadow:0 20px 60px rgba(0,0,0,.25); }
    .box.wide { width:min(640px, 100%); }
    .logo { width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg,#6366f1,#8b5cf6 50%,#ec4899);
            display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.4rem; box-shadow:0 8px 22px rgba(99,102,241,.4); }
    .form-control, .form-select { background:var(--input) !important; color:var(--text) !important; border-color:var(--border) !important; border-radius:10px; padding:.6rem .8rem; }
    .form-control:focus { border-color:#6366f1 !important; box-shadow:0 0 0 3px rgba(99,102,241,.25) !important; }
    .form-label { font-size:.78rem; color:var(--muted); font-weight:600; }
    .btn-cta { background:linear-gradient(135deg,#6366f1,#8b5cf6 50%,#ec4899); color:#fff; border:0; font-weight:600; padding:.65rem; border-radius:10px; }
    .btn-cta:hover { color:#fff; filter:brightness(1.07); }
    .muted { color:var(--muted); } a { color:#818cf8; text-decoration:none; }
    .key { font-family:ui-monospace,Consolas,monospace; font-size:1.25rem; letter-spacing:2px; padding:1rem; border-radius:12px;
           border:2px dashed #6366f1; text-align:center; background:rgba(99,102,241,.08); user-select:all; }
  </style>
</head>
<body>
  <div class="box {% block wide %}{% endblock %}">
    <div class="d-flex align-items-center gap-3 mb-3"><div class="logo"><i class="bi bi-shield-lock"></i></div>
      <div><div class="fw-bold" style="font-size:1.15rem">Finance Hub</div><div class="muted" style="font-size:.78rem">{% block sub %}Encrypted · this computer only{% endblock %}</div></div></div>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for cat, msg in messages %}
      <div class="alert alert-{{ cat if cat in ('success','warning','danger') else 'info' }} py-2 px-3" style="font-size:.84rem">{{ msg }}</div>
    {% endfor %}{% endwith %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
